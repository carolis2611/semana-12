Python tests
on: 
  push:
      branches:
-main
  jobs:
    testes:
        runs-on: ubuntu-latest
    steps:

-name: Baixar código
uses: actions/checkout@v4
-name: instalar Python
uses: actions/setup-python@v5
    with:
      python-version: '3.11'
-name: instalar pytest
  run: pip install pytest
-name: Executar testes
  run: pytest
